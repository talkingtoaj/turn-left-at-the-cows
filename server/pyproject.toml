[project]
name = "turn-left-at-the-cows-server"
version = "0.1.0"
description = "Serves Turn Left at the Cows (the built Vite game) and the shared-maps API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# Not an installable package: `python -m mapshare` runs from this folder, so
# `uv run --frozen --no-dev` never has to build anything when the container starts.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
