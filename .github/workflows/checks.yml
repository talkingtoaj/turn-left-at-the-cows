# Pull requests: run the repo's checks (npm run check:all). Our own art and
# sound are not in git (assets.txt); the checks pass without them.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run -s check:all
      # Start the game in a headless browser: check:all never loads the scene.
      - run: npx -y playwright@1.65.1 install --with-deps chromium
      - run: npm run -s check:boot
