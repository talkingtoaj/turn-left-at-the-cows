# Push to main -> build the image -> deploy Cloud Run service turn-left-at-the-cows.
# One-time setup (bucket, Artifact Registry repo, secrets, service accounts,
# the trigger): see server/README.md. The Turnstile secret and the admin token
# come from Secret Manager; the site key is public and set on the trigger as
# the _TURNSTILE_SITE_KEY substitution.

substitutions:
  _REGION: us-central1
  _REPO: turn-left-at-the-cows
  _SERVICE_NAME: turn-left-at-the-cows
  _RUNTIME_SA: turn-left-at-the-cows-run
  _MAPS_BUCKET: turn-left-at-the-cows-maps
  _MAPS_PREFIX: maps/
  _TURNSTILE_SITE_KEY: ""
  _SITE_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --build-arg=SITE_URL=${_SITE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest
      - .

  # Start the image the way Cloud Run does (python -m, no argv) and curl it
  # before it can take traffic. ($$ keeps a $ away from Cloud Build substitution.)
  - id: smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        docker run -d --name smoke --network cloudbuild -e PORT=8080 -e STORAGE=memory \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
        for i in $$(seq 1 30); do
          if docker run --rm --network cloudbuild curlimages/curl:8.10.1 -fsS http://smoke:8080/health; then break; fi
          sleep 1
        done
        docker run --rm --network cloudbuild curlimages/curl:8.10.1 -fsS http://smoke:8080/health
        docker run --rm --network cloudbuild curlimages/curl:8.10.1 -fsS -o /dev/null http://smoke:8080/
        docker run --rm --network cloudbuild curlimages/curl:8.10.1 -fsS "http://smoke:8080/api/maps?mission=m1_parcel"
        docker logs smoke
        docker rm -f smoke

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=STORAGE=gcs,MAPS_BUCKET=${_MAPS_BUCKET},MAPS_PREFIX=${_MAPS_PREFIX},TURNSTILE_SITE_KEY=${_TURNSTILE_SITE_KEY}
      - --set-secrets=TURNSTILE_SECRET_KEY=turn-left-turnstile-secret:latest,ADMIN_TOKEN=turn-left-admin-token:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=4
      - --concurrency=80
      - --timeout=60
